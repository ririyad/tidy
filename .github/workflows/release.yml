name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build for (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Build and upload Apple Silicon release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: Tidy ${{ steps.meta.outputs.tag }}
          releaseBody: |
            Local-first desktop reader and fetch engine (Markdown vault + SQLite index).

            ### Included in this release
            - **M0** Scaffold — Tauri + SvelteKit shell, vault init, SQLite schema
            - **M1** Discovery — polite HTTP, robots/feeds/sitemaps, crawl fallback
            - **M2** Extraction — readability → markdown, images, vault writes
            - **M3** Reader UI — Information Feed, themes, keyboard nav, source CRUD

            ### Platform
            - **macOS Apple Silicon** (`aarch64-apple-darwin`) — `.dmg` / `.app` in Assets

            Unsigned builds: right-click → Open the first time, or allow in System Settings → Privacy & Security.
            Code signing / notarization will land when Apple Developer credentials are configured.

            See [CHANGELOG.md](https://github.com/ririyad/tidy/blob/main/CHANGELOG.md) for details.
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
