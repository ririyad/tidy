name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build for (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-macos:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ./src-tauri -> target
          key: release-${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Build and upload ${{ matrix.name }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: Tidy ${{ steps.meta.outputs.tag }}
          releaseBody: |
            Local-first desktop reader and fetch engine (Markdown vault + SQLite index).

            ### Included in this release
            - **M0–M3** Vault, discovery, extraction, Information Feed reader
            - **M4** Per-source scheduler, launch catch-up, fetch run history

            ### Platforms (unsigned)
            - **Apple Silicon** — `Tidy_*_aarch64.dmg` / `.app.tar.gz`
            - **Intel** — `Tidy_*_x64.dmg` / `.app.tar.gz`

            Pick the DMG that matches your Mac (Apple menu → About This Mac).

            **First open:** Gatekeeper may say the app is “damaged” after a browser download.
            That is the quarantine flag on an unsigned build. After installing to Applications:

            ```bash
            xattr -cr /Applications/Tidy.app && open /Applications/Tidy.app
            ```

            See [CHANGELOG.md](https://github.com/ririyad/tidy/blob/main/CHANGELOG.md) for details.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
